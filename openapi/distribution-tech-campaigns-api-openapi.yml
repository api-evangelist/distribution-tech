components:
  schemas:
    CampaignRenamed:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - campaign_id
      - name
      additionalProperties: false
    PaymentOption:
      type: object
      properties:
        rail:
          type: string
          enum:
          - checkout
          - invoice
        label:
          type: string
        clears:
          type: string
      required:
      - rail
      - label
      - clears
      additionalProperties: false
    CampaignInput:
      type: object
      required:
      - goal
      - product
      - moment
      - window_start
      - window_end
      - budget_usd
      description: Left out, audience and company come from your company context (the audience your website read found; with no website read yet, send audience), geography is worldwide and desired_outcome is the goal's usual outcome; the answer's defaults names each field filled. A 422 names every required field that is missing, each in details.problems.
      properties:
        goal:
          type: string
          enum:
          - launch
          - funding
          - feature
          - program
        product:
          type: string
          maxLength: 2000
        moment:
          type: string
          maxLength: 2000
          description: What goes live and when.
        audience:
          type: string
          minLength: 10
          maxLength: 2000
        geography:
          type: string
          maxLength: 300
        window_start:
          type: string
          format: date
        window_end:
          type: string
          format: date
        budget_usd:
          type: integer
          minimum: 10
          description: 'The most to spend, in US dollars. The plan is held to this key''s mandate: never above its maximum plan total or what is left of its monthly cap.'
        budget_min_usd:
          type: integer
          minimum: 1
          description: The least to spend. Above the mandate's maximum plan total, or what is left of its monthly cap, the campaign is refused (mandate_refused). Left out, the budget is held to the mandate instead of refused.
        desired_outcome:
          type: string
          minLength: 5
          maxLength: 2000
        company:
          type: string
          maxLength: 300
        constraints:
          type: string
          maxLength: 2000
    CreatorGuidelinesInput:
      type: object
      additionalProperties: false
      description: Every field is optional; a field left out is cleared. Creators read pitch, dos and donts with their proposal and everything once they accept.
      properties:
        pitch:
          type: string
          maxLength: 800
        key_messages:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 200
        references:
          type: array
          maxItems: 8
          items:
            type: string
            pattern: ^https://
            maxLength: 500
        voice:
          type: string
          maxLength: 300
        dos:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 200
        donts:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 200
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - bad_request
              - filter_required
              - unauthorized
              - forbidden
              - not_found
              - method_not_allowed
              - rate_limited
              - unavailable
              - internal
              - mandate_refused
              - conflict
              - unprocessable
              - idempotency_conflict
              - in_progress
            message:
              type: string
            details:
              type: object
              description: 'Machine-readable facts. mandate_refused: reason (no_mandate, mandate_expired, channel_not_allowed, approval_not_allowed, terms_not_accepted, over_max_plan_total, over_monthly_cap, over_budget), limit_cents, requested_cents, over_by_cents, spent_cents, and escalate: true (take it to a person at the brand). conflict: reason; for over_budget on plan_add_creator or plan_swap_creator also budget_cents, remaining_cents (the room the plan had before the creator), price_cents and over_by_cents. unprocessable: problems, each a field and a message.'
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    QuoteLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creator:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              id:
                type: string
                format: uuid
                description: The creator's id, for creator_get. Left out when not known.
              name:
                type:
                - string
                - 'null'
              handle:
                type:
                - string
                - 'null'
                description: The creator's X handle (every creator on a plan line is approved, so it is named before payment).
              profile_url:
                type:
                - string
                - 'null'
                description: The creator's X profile link (every creator on a plan line is approved, so it is named before payment).
              avatar_url:
                type: string
                format: uri
                description: The creator's live profile photo. Left out when there is none.
              followers:
                type: integer
                minimum: 0
                description: The creator's follower count on the channel. Left out when not measured.
            required:
            - name
            - handle
            - profile_url
            additionalProperties: false
        creator_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The creator's id at the top level (the same as creator.id); null when not known.
        unit_id:
          type:
          - string
          - 'null'
          format: uuid
        stage_id:
          type: string
          enum:
          - planned
          - offered
          - creator_confirmed
          - scheduled
          - live
          - proof_attached
          - cancelled
          description: Where this post stands; the same stage model as a campaign's lines_by_stage. Branch on this, never on stage.
        stage:
          type: string
          description: 'The label for stage_id: Planned, Offered, Creator confirmed, Scheduled, Live, Proof attached, Cancelled.'
        channel:
          type: string
        channel_label:
          type: string
        format:
          type:
          - string
          - 'null'
        deliverable:
          type: string
        scheduled_date:
          type: string
          format: date
        price_cents:
          type: integer
          description: The all-in price of this line. Never split into parts.
        review:
          type:
          - string
          - 'null'
          description: 'The creator''s review state in brand words: Approved, or Under review. Null for a line with no creator yet.'
        vetting:
          type:
          - string
          - 'null'
          deprecated: true
          x-sunset: '2026-11-20'
          description: 'Deprecated: the same value as review. Removed on 2026-11-20; read review.'
        reason:
          type:
          - string
          - 'null'
        expected_views_low:
          type:
          - integer
          - 'null'
        expected_views_high:
          type:
          - integer
          - 'null'
        on_sale:
          type: boolean
      required:
      - id
      - creator
      - creator_id
      - unit_id
      - stage_id
      - stage
      - channel
      - channel_label
      - format
      - deliverable
      - scheduled_date
      - price_cents
      - review
      - vetting
      - reason
      - expected_views_low
      - expected_views_high
      - on_sale
      additionalProperties: false
    CreatorGuidelines:
      type: object
      properties:
        pitch:
          type: string
          maxLength: 800
          description: What the post should get across. Empty when not set.
        key_messages:
          type: array
          items:
            type: string
            maxLength: 200
        references:
          type: array
          items:
            type: string
            format: uri
            maxLength: 500
        voice:
          type: string
          maxLength: 300
        dos:
          type: array
          items:
            type: string
            maxLength: 200
        donts:
          type: array
          items:
            type: string
            maxLength: 200
      required:
      - pitch
      - key_messages
      - references
      - voice
      - dos
      - donts
      additionalProperties: false
    GuidelinesSet:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        creator_guidelines:
          $ref: '#/components/schemas/CreatorGuidelines'
      required:
      - campaign_id
      - creator_guidelines
      additionalProperties: false
    RenameInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: The new name; spaces are collapsed.
      required:
      - name
      additionalProperties: false
    CampaignCreated:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - plan_ready
          - no_plan
        plan:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Quote'
        plan_note:
          type:
          - string
          - 'null'
        defaults:
          type: array
          items:
            type: string
            enum:
            - company
            - audience
            - geography
            - desired_outcome
          description: The fields filled because the request left them out.
        budget:
          type: object
          properties:
            min_usd:
              type:
              - integer
              - 'null'
            max_usd:
              type:
              - integer
              - 'null'
            held:
              type: boolean
          required:
          - min_usd
          - max_usd
          - held
          additionalProperties: false
          description: The budget the campaign was stored with. held is true when budget_usd alone was held lower, to what the mandate allows.
      required:
      - campaign_id
      - status
      - plan
      - plan_note
      additionalProperties: false
    CampaignDeleted:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        deleted:
          const: true
      required:
      - campaign_id
      - deleted
      additionalProperties: false
    Mandate:
      type:
      - object
      - 'null'
      properties:
        key_id:
          type: string
          format: uuid
        version:
          type: integer
        max_plan_cents:
          type: integer
        monthly_cap_cents:
          type: integer
        channels:
          type: array
          items:
            type: string
        may_approve:
          type: boolean
        may_exceed_budget:
          type: boolean
          deprecated: true
          description: 'Retired, always false. No key and no person can approve a plan over its campaign''s budget: approve_plan refuses it with over_budget until a creator is removed or the budget is raised.'
        expires_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        spent_this_month_cents:
          type: integer
        terms_version:
          type:
          - string
          - 'null'
          description: The brand terms a person accepted for this key. Null on a mandate that may not sign (the terms govern signing) and on the workspace's own agent key.
        terms_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        terms_accepted_email:
          type:
          - string
          - 'null'
    CampaignArchived:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        archived_at:
          type: string
          format: date-time
      required:
      - campaign_id
      - archived_at
      additionalProperties: false
    CampaignSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: 'The campaign''s name as the workspace shows it: the product, else the company, shortened; Untitled campaign when neither is set (a plan started from one creator).'
        company:
          type:
          - string
          - 'null'
        product:
          type:
          - string
          - 'null'
        objective:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        plan_status:
          type:
          - string
          - 'null'
          enum:
          - awaiting_approval
          - approved
          - null
        open_change:
          type: boolean
        intent_status:
          type:
          - string
          - 'null'
          enum:
          - draft
          - ready
          - null
        stage_id:
          type: string
          enum:
          - draft
          - sent
          - plan_ready
          - approved
          - paid
          - running
          - complete
          - cancelled
          description: draft (not sent), sent (no plan yet), plan_ready (a plan waits for approval), approved (signed, not paid), paid (the brand's payment cleared, no post started), running (a post is scheduled, live or delayed), complete (every post has its proof), cancelled (the order was cancelled or refunded).
        stage:
