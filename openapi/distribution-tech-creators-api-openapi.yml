openapi: 3.2.0
info:
  title: distribution Creators API
  version: 1.29.0
  description: 'Your own distribution workspace for your agents and systems. Every endpoint takes an API key you create in the workspace (Developers) as Authorization: Bearer and returns exactly what the workspace shows you. Reads are GET. The writes (start a campaign, change its creators, set what its creators read, approve for a payment link) need a key with campaigns:write or plans:approve, an Idempotency-Key header, and act only inside the mandate your brand sets on the key in Developers: its maximum plan total, monthly cap, channels, whether it may sign, its expiry and the brand terms a person accepted for it. A request outside the mandate is refused before any spend with the limit and how much over. Approved creators on sale are listed by name with their X handle and profile link, before any purchase, and every creator on a plan line is named before payment; a creator who is not approved carries no handle in lists and profiles; not-reviewed, declined and paused creators are never listed (operator decisions 2026-10-08). What bookable means (DT-021): A creator is bookable (on sale) when all of these hold: our team approved the creator after review (verified and active); our review keeps the creator among those we sell, not flagged as an inactive account and not excluded; and at least one of the creator''s formats has a fresh price: a price at most 30 days old, or a price quoted by our team. Every surface counts bookable creators with this one rule (the Creators list''s priced, Market''s Bookable now, the Overview, the chat, creators_search priced and catalog.priced, GET /api/network/facts and the guest quote), so the same filter shows the same number. An approved creator who is not bookable is still listed, with price on request. Any valid key may send feedback (POST /feedback) when something fails, is missing or could be better; it reaches the team directly. The same reads and writes are tools on the MCP server at /api/mcp. Changelog: 2026-10-21 (1.29.0): a quote line carries review, the creator''s review state (Approved, Under review), on REST and MCP; vetting stays as a deprecated alias with the same value until 2026-11-20, so read review (DT-205). 2026-10-21 (1.28.0): every approved creator is named before purchase: its X handle and profile link (handle, url) on every creator read, GET /creators rows and creators_search (CreatorSummary now lists handle and url), GET /creators/{id} and creator_get, with its post links; and a plan names its creators before payment too: plan_quote lines carry creator.handle and creator.profile_url, and campaign_status line slots carry the @handle, whatever the order''s payment state. A creator who is not approved carries no handle in lists and profiles. 2026-10-21 (1.27.0): every campaign (list and status) and every line proposal carries brand_context_version, the version of your brand context (GET /brain) in force when it was created; it is frozen there, so editing the context later never changes it, and null means there was no context yet. 2026-10-21 (1.26.3): GET /creators and GET /creators/{id} refuse a query parameter they do not take (handle, for one) with 400 bad_request, details.problems naming it and details.accepted listing what they take, instead of ignoring it. A client that sends an extra parameter now gets 400 and must drop it. Over the daily creator-view limit, an id not opened today answers 429 daily_seen before it is looked up, so an id no creator has answers 429 too, not 404: the limit never reveals which ids exist (DT-324). 2026-10-21 (1.26.2): a creator read''s 429 daily_lists (the day''s 60 list calls, each GET /creators page or creators_search) and daily_reveals carry details.limit, and daily_lists says list calls, never creator views; both are described with the creator read limits (DT-337).'
servers:
- url: https://app.distribution.tech/api/v1
tags:
- name: Creators
paths:
  /creators:
    get:
      summary: Approved creators on sale now, by name, with price per format and format advice
      description: 'Scope: creators:read. Takes only the parameters listed here: any other (handle, for one) is refused with 400 bad_request, details.problems naming it and details.accepted listing these, never ignored (DT-324).'
      security:
      - apiKey:
        - creators:read
      parameters:
      - name: q
        in: query
        required: false
        description: Part of a name, handle or bio.
        schema:
          type: string
          maxLength: 80
      - name: segment
        in: query
        required: false
        description: An audience segment id, e.g. ai or saas_b2b.
        schema:
          type: string
          pattern: ^[a-z0-9_]{2,40}$
      - name: reach_band
        in: query
        required: false
        description: The creator's size by followers.
        schema:
          type: string
          enum:
          - nano
          - micro
          - mid
          - macro
          - mega
      - name: goal
        in: query
        required: false
        description: 'The campaign''s goal: launch, funding or feature (an announcement with a post of yours to quote) or program (steady reach). Shapes the format advice.'
        schema:
          type: string
          enum:
          - launch
          - funding
          - feature
          - program
      - name: match
        in: query
        required: false
        description: 'Your audience segments, comma separated (from /audience): adds match_score (over 70 strong, over 50 good) and ranks by it.'
        schema:
          type: string
          maxLength: 300
      - name: limit
        in: query
        required: false
        description: 'Page size: default 24, at most 50.'
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 24
      - name: offset
        in: query
        required: false
        description: Where the page starts; page through every approved creator with total.
        schema:
          type: integer
          minimum: 0
          maximum: 999999
          default: 0
      - name: fit
        in: query
        required: false
        description: 'true: only creators reaching at least one of the match segments (the ''fit your audience'' set); total then counts only those.'
        schema:
          type: boolean
      - name: country
        in: query
        required: false
        description: The creator's country as X reports it, exact and case-insensitive, e.g. United States.
        schema:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[^<>%_\\]*\S[^<>%_\\]*$
      - name: language
        in: query
        required: false
        description: The language the creator posts in, exact and case-insensitive, e.g. English.
        schema:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[^<>%_\\]*\S[^<>%_\\]*$
      - name: followers_min
        in: query
        required: false
        description: At least this many X followers.
        schema:
          type: integer
          minimum: 0
          maximum: 1000000000
      - name: followers_max
        in: query
        required: false
        description: At most this many X followers.
        schema:
          type: integer
          minimum: 0
          maximum: 1000000000
      - name: er_min
        in: query
        required: false
        description: At least this engagement rate over the last 30 days, in percent (0 to 100, two decimals).
        schema:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
      - name: match_min
        in: query
        required: false
        description: At least this match score (0 to 100; over 70 strong, over 50 good). Needs match.
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: format
        in: query
        required: false
        description: Only creators selling this format; price and price filters then read that format's price.
        schema:
          type: string
          enum:
          - post
          - quote
          - thread
      - name: price_min
        in: query
        required: false
        description: The cheapest all-in price (of the format, when one is given) is at least this many US dollars.
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
      - name: price_max
        in: query
        required: false
        description: The cheapest all-in price (of the format, when one is given) is at most this many US dollars.
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
      - name: sort
        in: query
        required: false
        description: 'Order: match (default, best fit first), followers, engagement, views (median views a post) or price (cheapest all-in price).'
        schema:
          type: string
          enum:
          - match
          - followers
          - engagement
          - views
          - price
          default: match
      - name: dir
        in: query
        required: false
        description: desc (default) or asc.
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
      - name: budget
        in: query
        required: false
        description: The campaign budget in US dollars. It sizes the shortlist (three times the posts it buys at the good fits' median price, 10 to 50); without it the list is 25. It never filters.
        schema:
          type: integer
          minimum: 1
          maximum: 10000000
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              description: Requests one window allows for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window closes; the next request after that opens a new one.
              schema:
                type: integer
            RateLimit-Policy:
              description: 'The limit and the window in seconds, e.g. 60;w=60. The window is fixed: it opens at the key''s first request after the last one closed (DT-271), so a burst across two windows can pass more than the limit in one rolling minute.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creators'
        '400':
          description: 'A parameter is not valid: details.problems names each field and what it accepts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No API key, an unknown one, or a revoked one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The key does not have this endpoint's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Too many requests for this key in the current minute (60); Retry-After and RateLimit-Reset say when to try again. On POST /campaigns and on POST /plans/current/lines when it starts a plan: the brand''s 3 new campaigns in 24 hours are used (details.reason daily_campaign_limit); details.resets_at and Retry-After say when the limit reopens, a rolling 24 hours from the first of them, not a calendar day; archiving or deleting a campaign does not give its slot back. On GET /creators and GET /creators/{id}: a creator read limit is used (details.reason per_minute, daily_lists, daily_reveals, daily_seen or locked). daily_seen is your workspace''s one pool of 300 creator views a day (300 different creators shown or opened since midnight UTC), shared by the app and every API key of the brand: details.scope workspace and details.limit 300; a creator already seen today, in the app or through any key, still opens and costs nothing. daily_lists is the day''s list calls (each GET /creators page or creators_search is one; details.limit, 60): it is counted apart from creator views, resets at midnight UTC, and Retry-After says when. daily_reveals is the day''s creator profiles opened (details.limit, 60). The other reasons are this key''s own limit (details.scope key) or the brand''s ceiling over all its keys (details.scope api).'
          headers:
            Retry-After:
              schema:
                type: integer
            RateLimit-Limit:
              description: Requests one window allows for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window closes; the next request after that opens a new one.
              schema:
                type: integer
            RateLimit-Policy:
              description: 'The limit and the window in seconds, e.g. 60;w=60. The window is fixed: it opens at the key''s first request after the last one closed (DT-271), so a burst across two windows can pass more than the limit in one rolling minute.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal: the request failed on our side. Try again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'unavailable: the service or this part of it is not reachable right now. Try again shortly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Creators
      operationId: getCreators
      x-operation-id-source: derived
  /creators/{id}:
    get:
      summary: One creator's full profile
      description: 'Scope: creators:read. One creator by the id a GET /creators row carries (a UUID), at /api/v1/creators/{id}. There is no lookup by X handle; an approved creator''s read carries its handle and x.com link, any other creator''s none, and this profile is opened by id only. MCP tool: creator_get. Takes only goal as a query parameter; any other is refused with 400 bad_request (DT-324). Over the 300 daily creator views, an id not opened today answers 429 daily_seen before it is looked up, whether or not a creator has it: the limit never reveals which ids exist (DT-324).'
      security:
      - apiKey:
        - creators:read
      parameters:
      - name: id
        in: path
        required: true
        description: The creator's id from a GET /creators row (a UUID).
        schema:
          type: string
          format: uuid
      - name: goal
        in: query
        required: false
        description: 'The campaign''s goal: launch, funding or feature (an announcement with a post of yours to quote) or program (steady reach). Shapes the format advice.'
        schema:
          type: string
          enum:
          - launch
          - funding
          - feature
          - program
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              description: Requests one window allows for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window closes; the next request after that opens a new one.
              schema:
                type: integer
            RateLimit-Policy:
              description: 'The limit and the window in seconds, e.g. 60;w=60. The window is fixed: it opens at the key''s first request after the last one closed (DT-271), so a burst across two windows can pass more than the limit in one rolling minute.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'
        '400':
          description: 'A parameter is not valid: details.problems names each field and what it accepts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No API key, an unknown one, or a revoked one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The key does not have this endpoint's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No approved creator has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Too many requests for this key in the current minute (60); Retry-After and RateLimit-Reset say when to try again. On POST /campaigns and on POST /plans/current/lines when it starts a plan: the brand''s 3 new campaigns in 24 hours are used (details.reason daily_campaign_limit); details.resets_at and Retry-After say when the limit reopens, a rolling 24 hours from the first of them, not a calendar day; archiving or deleting a campaign does not give its slot back. On GET /creators and GET /creators/{id}: a creator read limit is used (details.reason per_minute, daily_lists, daily_reveals, daily_seen or locked). daily_seen is your workspace''s one pool of 300 creator views a day (300 different creators shown or opened since midnight UTC), shared by the app and every API key of the brand: details.scope workspace and details.limit 300; a creator already seen today, in the app or through any key, still opens and costs nothing. daily_lists is the day''s list calls (each GET /creators page or creators_search is one; details.limit, 60): it is counted apart from creator views, resets at midnight UTC, and Retry-After says when. daily_reveals is the day''s creator profiles opened (details.limit, 60). The other reasons are this key''s own limit (details.scope key) or the brand''s ceiling over all its keys (details.scope api).'
          headers:
            Retry-After:
              schema:
                type: integer
            RateLimit-Limit:
              description: Requests one window allows for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window closes; the next request after that opens a new one.
              schema:
                type: integer
            RateLimit-Policy:
              description: 'The limit and the window in seconds, e.g. 60;w=60. The window is fixed: it opens at the key''s first request after the last one closed (DT-271), so a burst across two windows can pass more than the limit in one rolling minute.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal: the request failed on our side. Try again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'unavailable: the service or this part of it is not reachable right now. Try again shortly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Creators
      operationId: getCreatorsById
      x-operation-id-source: derived
  /creators/{id}/price-request:
    post:
      summary: Ask for a price
      description: 'Ask our team for the price of an approved creator with nothing on sale (ask_price true and price_estimate on its row; the estimate is never a price). The team prices it, the price then shows on the creator (creator_get offerings) and as a priced answer on your plan, held for you for 48 hours; nothing is booked or charged until you add the creator to a plan and approve it. It reaches our team, never the creator. One open ask per creator: asking again answers already true and sends nothing. Opening the creator counts as one creator opened today (free when already opened). 3 asks for one creator and 20 in all in any 24 hours (rate_limited, reason daily_limit, with retry_after and resets_at saying when that limit reopens). A creator with a format on sale answers conflict, reason already_priced: add it with plan_add_creator. Optionally campaign_id: one of your campaigns the ask is for. Scope: creators:read. No Idempotency-Key: an ask is one open request per creator, so a retry while it is open answers already true; once it is answered or its 48 hours run out, asking again opens a new one. MCP tool: creator_ask_price.'
      security:
      - apiKey:
        - creators:read
      parameters:
      - name: id
        in: path
        required: true
        description: The creator's id from a GET /creators row (a UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskPriceInput'
      responses:
        '200':
          description: Asked, or already asked (already true).
          headers:
            RateLimit-Limit:
              description: Requests one window allows for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window closes; the next request after that opens a new one.
              schema:
                type: integer
            RateLimit-Policy:
              description: 'The limit and the window in seconds, e.g. 60;w=60. The window is fixed: it opens at the key''s first request after the last one closed (DT-271), so a burst across two windows can pass more than the limit in one rolling minute.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAsked'
        '400':
          description: 'A parameter is not valid: details.problems names each field and what it accepts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No API key, an unknown one, or a revoked one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The key lacks creators:read, or the demo workspace (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No approved creator has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'conflict, reason already_priced: a format is on sale; add it with plan_add_creator instead.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'unprocessable: not answered today; listed so every POST declares the same statuses.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Too many creator reads (the creator meter: opening this creator counts as one creator opened today, free when already opened), or the daily ask limit: 3 for one creator and 20 in all in 24 hours (rate_limited, details.reason daily_limit). Retry-After says when.'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal: the request failed on our side. Try again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 'unavailable: the ask did not reach our team, so it was not kept. Try again in a minute.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'unavailable: the service or this part of it is not reachable right now. Try again shortly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Creators
      operationId: postCreatorsByIdPriceRequest
      x-operation-id-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - bad_request
              - filter_required
              - unauthorized
              - forbidden
              - not_found
              - method_not_allowed
              - rate_limited
              - unavailable
              - internal
              - mandate_refused
              - conflict
              - unprocessable
              - idempotency_conflict
              - in_progress
            message:
              type: string
            details:
              type: object
              description: 'Machine-readable facts. mandate_refused: reason (no_mandate, mandate_expired, channel_not_allowed, approval_not_allowed, terms_not_accepted, over_max_plan_total, over_monthly_cap, over_budget), limit_cents, requested_cents, over_by_cents, spent_cents, and escalate: true (take it to a person at the brand). conflict: reason; for over_budget on plan_add_creator or plan_swap_creator also budget_cents, remaining_cents (the room the plan had before the creator), price_cents and over_by_cents. unprocessable: problems, each a field and a message.'
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    PastCollab:
      type: object
      required:
      - project
      - role
      properties:
        project:
          type: string
          description: The project or brand.
        title:
          type:
          - string
          - 'null'
          description: The launch's own title, when it says more than the project name.
        date:
          type:
          - string
          - 'null'
          format: date
          description: When the launch went out.
        role:
          type: string
          enum:
          - Launch post
          - Quoted the launch
          - Paid partnership
          description: What the creator did.
        url:
          type:
          - string
          - 'null'
          description: The creator's post, or the launch post, on X.
        brand:
          type: object
          description: 'Who the launch was for (DT-128): the account that posted it. Logo: avatar_url, else the site''s favicon, else initials.'
          properties:
            handle:
              type:
              - string
              - 'null'
              description: The brand's X handle.
            avatar_url:
              type:
              - string
              - 'null'
              description: The brand's X avatar (https).
            site:
              type:
              - string
              - 'null'
              description: The brand's site as a bare domain.
            initials:
              type: string
              description: One or two letters for the fallback mark.
    CreatorSummary:
      type: object
      description: 'A creator in a list: the Creator fields without recent_posts and posts_summary (handle and url as on Creator: set for an approved creator, null otherwise), and collaborations without their link (DT-127).'
      properties:
        provenance:
          type: object
          description: 'DT-159: where each of the creator''s measured numbers came from, one entry per stat (served since DT-159; documented from 1.25.2, DT-160).'
          properties:
            followers:
              type: object
              description: 'DT-159: where this number came from: source, method, measured_at, expires_at, label (Verified, Creator-reported or Estimated), stale, and as_of text.'
              properties:
                source:
                  type: string
                method:
                  type: string
                measured_at:
                  type:
                  - string
                  - 'null'
                expires_at:
                  type:
                  - string
                  - 'null'
                label:
                  type: string
                  enum:
                  - Verified
                  - Creator-reported
                  - Estimated
                stale:
                  type: boolean
                as_of:
                  type:
                  - string
                  - 'null'
            median_views_30d:
              type: object
              description: 'DT-159: where this number came from: source, method, measured_at, expires_at, label (Verified, Creator-reported or Estimated), stale, and as_of text.'
              properties:
                source:
                  type: string
                method:
                  type: string
                measured_at:
                  type:
                  - string
                  - 'null'
                expires_at:
                  type:
                  - string
                  - 'null'
                label:
                  type: string
                  enum:
                  - Verified
                  - Creator-reported
                  - Estimated
                stale:
                  type: boolean
                as_of:
                  type:
                  - string
                  - 'null'
            engagement_rate_30d:
              type: object
              description: 'DT-159: where this number came from: source, method, measured_at, expires_at, label (Verified, Creator-reported or Estimated), stale, and as_of text.'
              properties:
                source:
                  type: string
                method:
                  type: string
                measured_at:
                  type:
                  - string
                  - 'null'
                expires_at:
                  type:
                  - string
                  - 'null'
                label:
                  type: string
