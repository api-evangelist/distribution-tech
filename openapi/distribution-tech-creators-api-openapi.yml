          - approved
          - priced
          properties:
            approved:
              type: integer
              minimum: 0
              description: Every approved, verified, active creator in the network, priced or not.
            priced:
              type: integer
              minimum: 0
              description: 'Of those, the creators bookable now by the one rule in the API description (What bookable means): the number the app and the site show.'
        cap:
          type: integer
          description: How many creators the selection holds (the same as total).
        limit:
          type: integer
          description: 'This page''s size: default 24, at most 50.'
        offset:
          type: integer
          description: Where this page starts, at most total (an offset past the end is answered as total); the next page starts at offset + limit while it is below total.
