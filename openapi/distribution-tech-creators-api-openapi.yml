          type: integer
          description: How many of total are bookable now by the one rule in the API description (What bookable means); the rest carry price_estimate, never a price.
        catalog:
          type: object
          description: 'The whole network, whatever this call filtered: the same counts as the app and the site (GET /api/network/facts on the app host), refreshed at most every five minutes. Left out when the network cannot be counted right now, never guessed.'
