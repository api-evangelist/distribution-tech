  /plans/{id}/dates:
    post:
      summary: Move a plan's dates
      description: 'Move a plan awaiting approval to new dates in one step: start and end (YYYY-MM-DD) become the plan''s launch window and the campaign''s dates, and every creator''s post date moves with them, keeping its place in the window (a post three days in stays three days in) and pulled inside the new window when it is shorter. Both happen or neither does. start is today or later, end is on or after start, at most a year apart (conflict, reason bad_dates); two posts by one creator that would land on the same day are refused (conflict, reason same_day) and nothing moves; a signed plan or one the team wrote is refused (conflict, reason plan_signed). Prices do not change. Returns lines_moved and the plan as plan_quote returns it. Needs an idempotency_key. Scope: campaigns:write. MCP tool: plan_move_dates.'
      security:
      - apiKey:
        - campaigns:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
